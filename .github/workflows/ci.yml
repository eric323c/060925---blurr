name: CI

on:
  pull_request:
  push:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Show Node and NPM versions
        run: |
          node --version
          npm --version
      - name: Validate repository structure
        run: |
          test -f README.md
          test -d frontend
          test -d backend
